<section class="add-project">

  <h2>Ajouter un projet</h2>

  <form [formGroup]="projectGroup" (ngSubmit)="submit()">

    <label>
      Titre
      <input type="text" formControlName="title">
    </label>

    <label>
      Description
      <textarea formControlName="description"></textarea>
    </label>


    <label>
      URL
      <input type="text" formControlName="url">
    </label>


    <label>
      Image (URL)
      <input type="text" formControlName="imageUrl">
    </label>

    <button type="submit" [disabled]="projectGroup.invalid">
      Ajouter le projet
    </button>

  </form>

</section>

<style>
  .add-project {
    max-width: 600px;
    margin: auto;
    padding: 3rem 1.5rem;
    font-family: Arial, sans-serif;
  }

  .add-project h2 {
    text-align: center;
    margin-bottom: 2rem;
    font-size: 2rem;
  }

  form {
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  label {
    display: flex;
    flex-direction: column;
    font-weight: 600;
    gap: 0.4rem;
  }

  input, textarea {
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  button {
    margin-top: 1rem;
    padding: 0.8rem;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }

  button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
</style>
